# RedBull Segment Mapping Rules
# Used to refine segments when falling back to "CRM" or overriding specific groups
redbull_segments:
  - pattern: "ICD*"
    segment: "ICD"
    unit: null
  - pattern: "IPG*"
    segment: "IPG"
    unit: null
  - pattern: "CRT*"
    segment: "CRT"
    unit: null
  - pattern: "ICM*"
    segment: "ICM"
    unit: null
  - pattern: "LEADS*"
    segment: "Leads"
    unit: null
  - pattern: "CATH*"
    segment: "Catheters Ablation"
    unit: "EP"
  - pattern: "CATHETERS DIAGNOSTIC*"
    segment: "Catheters Diagnostic"
    unit: "EP"
  - pattern: "TRANSSEPTAL*"
    segment: "Transseptal Access"
    unit: "EP"

