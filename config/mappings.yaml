# Product Standardization Rules
# Maps exact strings in REDBULL PRODUCT to standardized names
# STRATEGY: 
# 1. "Conventional" -> Pure conventional (e.g. IPG SC Conventional)
# 2. "Leadless" / "S-ICD" -> Pure non-transvenous (e.g. IPG SC Leadless)
# 3. "+ Leadless" / "+ S-ICD" -> Combined category (e.g. IPG SC + Leadless)

product_renames:
  # --- IPG Single Chamber ---
  "IPG Single Chamber": "IPG SC Conventional"
  "IPG SINGLE CHAMBER": "IPG SC Conventional"
  "IPG Single Chamber Conventional": "IPG SC Conventional"
  "IPG SC Conventional": "IPG SC Conventional"
  "IPG SC": "IPG SC Conventional"
  
  # Leadless → same PRODUCT_GROUP as conventional parent (IPG SC)
  "Single Chamber IPG - Leadless": "IPG SC"
  "SINGLE CHAMBER IPG - LEADLESS": "IPG SC"
  "IPG Single Chamber - Leadless": "IPG SC"
  "IPG Leadless": "IPG SC"
  "IPG SC Leadless": "IPG SC"
  
  # Combined IPG mega-rollup → preserve combined identity
  "IPG SC & DC [Conventional + Leadless]": "IPG SC + Leadless"
  "IPG Single + Dual Chamber": "IPG SC + Leadless"
  "IPG SC + Leadless": "IPG SC + Leadless"
  
  # --- IPG Dual Chamber ---
  "IPG Dual Chamber": "IPG DC Conventional"
  "IPG DUAL CHAMBER": "IPG DC Conventional"
  "IPG DC Conventional": "IPG DC Conventional"
  "IPG DC": "IPG DC Conventional"
  
  # Leadless → same PRODUCT_GROUP as conventional parent (IPG DC)
  "Dual Chamber IPG - Leadless": "IPG DC"
  "DUAL CHAMBER IPG - LEADLESS": "IPG DC"
  "IPG Dual Chamber - Leadless": "IPG DC"
  "IPG DC Leadless": "IPG DC"
  
  "IPG DC + Leadless": "IPG DC"
  
  # --- ICD Single Chamber ---
  "ICD Single Chamber": "ICD SC Conventional"
  "ICD SINGLE CHAMBER": "ICD SC Conventional"
  "ICD SC Conventional": "ICD SC Conventional"
  "ICD SC": "ICD SC Conventional"
  
  # S-ICD / Non-Transvenous → same PRODUCT_GROUP as conventional parent (ICD SC)
  "S-ICD": "ICD SC"
  "ICD SC - Non-Transvenous": "ICD SC"
  "ICD SINGLE CHAMBER NON-TRANSVENOUS": "ICD SC"
  "ICD Single Chamber Non-Transvenous": "ICD SC"
  "ICD SC - Non-Transv.": "ICD SC"
  "ICD SC Non-Transv.": "ICD SC"
  "ICD SC S-ICD": "ICD SC"
  "ICD SC + Non-Trans.": "ICD SC + S-ICD"
  
  "ICD SC + S-ICD": "ICD SC + S-ICD"
  
  # --- ICD Dual Chamber ---
  "ICD Dual Chamber": "ICD DC Conventional"
  "ICD DUAL CHAMBER": "ICD DC Conventional"
  "ICD DC Conventional": "ICD DC Conventional"
  "ICD DC": "ICD DC Conventional"
  
  # --- CRTs ---
  "CRT Defibrillator": "CRT-D"
  "CRT Defibrillators": "CRT-D"
  "CRT DEFIBRILLATOR": "CRT-D"
  "CRT DEFIBRILLATORS": "CRT-D"
  "CRT - D": "CRT-D"
  "CRT – D": "CRT-D"
  "CRT - DEFIBRILLATORS": "CRT-D"
  
  "CRT Pacemaker": "CRT-P"
  "CRT Pacemakers": "CRT-P"
  "CRT PACEMAKER": "CRT-P"
  "CRT PACEMAKERS": "CRT-P"
  "CRT - P": "CRT-P"
  "CRT – P": "CRT-P"
  "CRT – P ": "CRT-P"
  "CRT - PACEMAKERS": "CRT-P"
  
  # --- Other ---
  "ICM & Other Diagnostics": "ICM"
  "ICM and Other Diagnostics": "ICM"
  "ICM & OTHER DIAGNOSTICS": "ICM"
  "ICM": "ICM"
  
  # iLP aliases → parent group (no longer separate product group)
  "IPG SC iLP": "IPG SC"
  "IPG DC iLP": "IPG DC"

